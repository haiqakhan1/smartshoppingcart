name: SmartShoppingCart CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Build and Test
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'  # Changed from 6.0 to 8.0
      
      - name: Restore dependencies
        working-directory: ./SmartShop  # Changed path
        run: dotnet restore
      
      - name: Build backend
        working-directory: ./SmartShop  # Changed path
        run: dotnet build --no-restore
      
      - name: Run tests
        working-directory: ./SmartShop  # Changed path
        run: dotnet test --no-build --verbosity normal
        continue-on-error: true

  frontend:
    name: Frontend Build and Test
    runs-on: windows-latest
    needs: backend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Changed from 18 to 20
      
      - name: Install dependencies
        working-directory: ./SmartCart  # Added - frontend is in SmartCart
        run: npm install
      
      - name: Build frontend
        working-directory: ./SmartCart  # Added - frontend is in SmartCart
        run: npm run build
        continue-on-error: false
